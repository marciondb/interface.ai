<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
  <title>{{tenant.displayName}} - System Maintenance</title>
  <link rel="stylesheet" type="text/css" href="/public/legacy.css">
</head>
<body bgcolor="#FFFFFF" text="#000000" link="#0000CC" vlink="#0000CC">

<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td>
      <font size="2"><b>System Maintenance Notice</b></font>
      <br><br>
      <font size="2">
        The Member Services Console is performing scheduled maintenance.<br>
        Click Continue to proceed to your requested screen.
      </font>
      <br><br>
      <form method="get" action="{{continuePath}}">
        <input type="submit" value="Continue">
      </form>
    </td>
  </tr>
</table>

</body>
</html>
