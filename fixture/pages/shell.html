<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
  <title>{{tenant.displayName}} - Member Services Console</title>
  <link rel="stylesheet" type="text/css" href="/public/legacy.css">
</head>
<body bgcolor="#C0C0C0" text="#000000" link="#0000CC" vlink="#0000CC" topmargin="0" leftmargin="0">

<table class="ns-page ns-shell" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF">
  <tr>
    <td class="ns-banner" bgcolor="#003366" colspan="2">
      <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td>
            <font color="#FFFFFF" face="Arial" size="3"><b>{{tenant.displayName}}</b></font><br>
            <font color="#B0C4DE" size="1">Member Services Console &nbsp;|&nbsp; Internal Use Only</font>
          </td>
          <td align="right" valign="middle">
            <font color="#FFFFFF" size="1">
              Signed on: operator &nbsp;|&nbsp;
              <a href="/logout" style="color:#FFFFFF"><font color="#FFFFFF" size="1">Sign Off</font></a>
            </font>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <!-- Left navigation — HTML in the shell, NOT a second frame -->
    <td class="ns-nav" width="160" valign="top" bgcolor="#003366">
      <table width="100%" cellpadding="4" cellspacing="0" border="0">
        <tr>
          <td bgcolor="#002244">
            <font color="#FFFFFF" size="1"><b>MAIN MENU</b></font>
          </td>
        </tr>
        <tr>
          <td>
            <font color="#FFFFFF" size="2">
              <a href="/welcome" target="content"><font color="#FFFFFF" size="2">Home</font></a>
            </font>
          </td>
        </tr>
        <tr>
          <td>
            <font color="#FFFFFF" size="2">
              <a href="{{tenant.routeBase}}/search" target="content"><font color="#FFFFFF" size="2">Member Lookup</font></a>
            </font>
          </td>
        </tr>
      </table>
    </td>
    <!-- Content frame — URL of this top page does not change when menu links are clicked -->
    <td class="ns-content" valign="top" bgcolor="#FFFFFF">
      <iframe name="content"
              src="/welcome"
              width="100%"
              height="520"
              frameborder="0"
              marginwidth="8"
              marginheight="8"
              scrolling="auto">
        Your browser does not support frames.
      </iframe>
    </td>
  </tr>
  <tr>
    <td class="ns-footer" colspan="2">
      <font size="1">{{tenant.displayName}} &mdash; Confidential &mdash; Unauthorized access prohibited</font>
    </td>
  </tr>
</table>

</body>
</html>
