<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
  <title>{{tenant.displayName}} - Open Sub-Account</title>
  <link rel="stylesheet" type="text/css" href="/public/legacy.css">
</head>
<body bgcolor="#FFFFFF" text="#000000" link="#0000CC" vlink="#0000CC">

<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td>
      <font size="2"><b>Open Sub-Account</b></font>
      <br>
      <font size="2">Member: {{memberId}} &mdash; {{memberName}}</font>
      <br><br>

      <form method="post" action="/member/subacct/new">
        <input type="hidden" name="memberId" value="{{memberId}}">
        <table class="ns-form" cellpadding="3" cellspacing="0" border="0" bgcolor="#EEEEEE">
          {{raw:errorHtml}}
          <tr>
            <td align="right"><font size="2">Account Type:</font></td>
            <td>
              <select name="{{name:ddlAccountType}}" id="{{id:ddlAccountType}}">
                {{raw:accountTypeOptions}}
              </select>
            </td>
          </tr>
          <tr>
            <td align="right"><font size="2">Nickname:</font></td>
            <td>
              <input type="text"
                     name="{{name:txtNickname}}"
                     id="{{id:txtNickname}}"
                     size="24"
                     maxlength="40"
                     value="{{nickname}}">
            </td>
          </tr>
          <tr>
            <td align="right"><font size="2">Initial Deposit:</font></td>
            <td>
              <font size="2">$</font>
              <input type="text"
                     name="{{name:txtInitialDeposit}}"
                     id="{{id:txtInitialDeposit}}"
                     size="12"
                     maxlength="16"
                     value="{{initialDeposit}}">
            </td>
          </tr>
          <tr>
            <td align="right"><font size="2">Funding Source:</font></td>
            <td>
              <select name="{{name:ddlFundingSource}}" id="{{id:ddlFundingSource}}">
                {{raw:fundingOptions}}
              </select>
            </td>
          </tr>
          <tr>
            <td align="right"><font size="2">Statement Delivery:</font></td>
            <td>
              <font size="2">
                <input type="radio"
                       name="{{name:rdoStatement}}"
                       id="{{id:rdoStatementMail}}"
                       value="Mail"
                       {{raw:statementMailChecked}}>
                Mail
                &nbsp;&nbsp;
                <input type="radio"
                       name="{{name:rdoStatement}}"
                       id="{{id:rdoStatementElectronic}}"
                       value="Electronic"
                       {{raw:statementElectronicChecked}}>
                Electronic
              </font>
            </td>
          </tr>
          <tr>
            <td>&nbsp;</td>
            <td>
              <input type="submit"
                     {{primarySubmit}}
                     value="Continue">
              &nbsp;
              <font size="2">
                <a href="/member/detail?memberId={{memberId}}">Cancel</a>
              </font>
            </td>
          </tr>
        </table>
      </form>

    </td>
  </tr>
</table>

</body>
</html>
