<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
  <title>{{tenant.displayName}} - Review Sub-Account</title>
  <link rel="stylesheet" type="text/css" href="/public/legacy.css">
</head>
<body bgcolor="#FFFFFF" text="#000000" link="#0000CC" vlink="#0000CC">

<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td>
      <font size="2"><b>Review Sub-Account Request</b></font>
      <br><br>

      <table class="ns-form" cellpadding="3" cellspacing="0" border="0">
        <tr>
          <td><font size="2">Member ID:</font></td>
          <td><font size="2">{{memberId}}</font></td>
        </tr>
        <tr>
          <td><font size="2">Account Type:</font></td>
          <td><font size="2">{{accountType}}</font></td>
        </tr>
        <tr>
          <td><font size="2">Nickname:</font></td>
          <td><font size="2">{{nickname}}</font></td>
        </tr>
        <tr>
          <td><font size="2">Initial Deposit:</font></td>
          <td><font size="2">${{initialDeposit}}</font></td>
        </tr>
        <tr>
          <td><font size="2">Funding Source:</font></td>
          <td><font size="2">{{fundingSource}}</font></td>
        </tr>
        <tr>
          <td><font size="2">Statement Delivery:</font></td>
          <td><font size="2">{{statementDelivery}}</font></td>
        </tr>
      </table>

      <br>
      <table class="ns-form" cellpadding="3" cellspacing="0" border="0">
        <tr>
          <td>
            <!-- Native confirm() — not present in the DOM as a dialog element -->
            <form method="post"
                  action="/member/subacct/confirm"
                  onsubmit="return confirm('Submit this sub-account request?');">
              <input type="submit" {{primarySubmit}} value="Confirm">
            </form>
          </td>
          <td>
            <font size="2">
              <a href="/member/subacct/new?memberId={{memberId}}">Back</a>
            </font>
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>

</body>
</html>
